run_id: awac_calvin_critic
run_root_dir: logs
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Calvin_AWAC
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-9B
    attn_implementation: sdpa
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/inspire_shared/calvin_abc_d
    data_mix: calvin_abc_d_h200
    action_type: delta_qpos
    obs_image_size: [224, 224]
    per_device_batch_size: 1
    load_all_data_for_training: false
    require_existing_parquet: true
    video_backend: torchvision_av
  awac_data:
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/inspire_shared/calvin_abc_d
    data_mix: calvin_abc_d_h200
    include_state: true
    action_type: delta_qpos
    obs_image_size: [224, 224]
    per_device_batch_size: 4
    num_workers: 4
    reward_column: reward
    done_column: done
    reward_is_chunk_return: true
    video_backend: torchvision_av

awac:
  gamma: 0.996
  num_q_heads: 2
  hidden_dim: 512
  transformer_layers: 6
  nhead: 8
  dim_feedforward: 2048
  awac_lambda: 0.5
  awac_weight_max: 20.0
  polyak_tau: 0.005
  freeze_visual: true
  dropout: 0.1
  max_vision_tokens: 256
  max_text_tokens: 128

trainer:
  pretrained_checkpoint: null
  awac_critic_checkpoint: null
  critic_max_train_steps: 50000
  actor_max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  logging_frequency: 50
  use_tensorboard: true
  tensorboard_log_dir: null
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  learning_rate:
    base: 1.0e-04
    critic: 3.0e-04
    action_model: 1.0e-04
  freeze_modules: qwen_vl_interface
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
