run_id: qwen35_pi_calvin_h200
run_root_dir: logs
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_Calvin
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-4B
    attn_implementation: sdpa
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    repeated_diffusion_steps: 2
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 32
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /inspire/qb-ilm2/project/26summer-camp-10/public/inspire_shared/calvin_abc_d
    data_mix: calvin_abc_d_h200
    action_type: delta_qpos
    obs_image_size: [224, 224]
    per_device_batch_size: 1
    load_all_data_for_training: false
    require_existing_parquet: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 1
  num_warmup_steps: 1
  save_interval: 1
  eval_interval: 1000
  learning_rate:
    base: 1.0e-04
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
